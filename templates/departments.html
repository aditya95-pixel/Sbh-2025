<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Department</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Poppins', sans-serif;
		}

		body {
			background: linear-gradient(to bottom right, #EB5B00, #A0C878);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
		}

		.form-container {
			background-color: rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(15px);
			-webkit-backdrop-filter: blur(15px);
			border-radius: 20px;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
			padding: 40px;
			width: 90%;
			max-width: 500px;
			text-align: center;
			position: relative;
			z-index: 2;
		}

		.form-container h1 {
			color: #fff;
			font-size: 2rem;
			margin-bottom: 30px;
		}

		.form-container label {
			display: block;
			color: #fff;
			text-align: left;
			margin-bottom: 8px;
			font-weight: 500;
		}

		.form-container input[type="text"],
		.form-container input[type="checkbox"] {
			width: 100%;
			padding: 10px;
			margin-bottom: 20px;
			border: none;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.7);
			font-size: 1rem;
			outline: none;
		}

		.form-container .checkbox-list {
			text-align: left;
			margin-bottom: 20px;
		}

		.form-container .checkbox-list label {
			display: flex;
			align-items: center;
			color: #fff;
			font-size: 1rem;
			margin-bottom: 10px;
		}

		.form-container .checkbox-list input[type="checkbox"] {
			width: auto;
			margin-right: 10px;
		}

		.form-container button {
			width: 100%;
			padding: 12px;
			border: none;
			border-radius: 10px;
			background-color: #fff;
			color: #333;
			font-weight: bold;
			font-size: 1.1rem;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.form-container button:hover {
			background-color: #333;
			color: #fff;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
		}

		.particles {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			pointer-events: none;
			overflow: hidden;
			z-index: 1;
		}

		.particles i {
			position: absolute;
			border-radius: 50%;
			display: block;
			width: 20px;
			height: 20px;
			background: rgba(255, 255, 255, 0.4);
			box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
			animation: float 20s linear infinite;
			bottom: -150px;
		}

		.particles i:nth-child(1) {
			left: 10%;
			animation-duration: 12s;
			width: 10px;
			height: 10px;
		}

		.particles i:nth-child(2) {
			left: 30%;
			animation-duration: 16s;
			width: 15px;
			height: 15px;
		}

		.particles i:nth-child(3) {
			left: 50%;
			animation-duration: 20s;
			width: 20px;
			height: 20px;
		}

		.particles i:nth-child(4) {
			left: 70%;
			animation-duration: 14s;
			width: 25px;
			height: 25px;
		}

		.particles i:nth-child(5) {
			left: 90%;
			animation-duration: 18s;
			width: 12px;
			height: 12px;
		}

		@keyframes float {
			0% {
				transform: translateY(0) rotate(0deg);
				opacity: 1;
			}

			100% {
				transform: translateY(-1200px) rotate(360deg);
				opacity: 0;
			}
		}

		@media (max-width: 768px) {
			.form-container {
				padding: 30px;
			}

			.form-container h1 {
				font-size: 1.8rem;
			}
		}

		@media (max-width: 480px) {
			.form-container {
				padding: 20px;
			}

			.form-container h1 {
				font-size: 1.5rem;
			}
		}
	</style>
</head>

<body>

	<div class="particles">
		<i></i><i></i><i></i><i></i><i></i>
	</div>

	<div class="form-container">
		<h1>Add Department</h1>
		<form method="POST" action="{{ url_for('departments') }}">
			<label>Department Name:</label>
			<input type="text" name="dept_name" required>

			<label>Select Courses:</label>
			<div class="checkbox-list">
				{% for course in courses %}
				<label>
					<input type="checkbox" name="courses" value="{{ course[0] }}">
					{{ course[1] }}
				</label>
				{% endfor %}
			</div>

			<button type="submit">Submit</button>
		</form>
	</div>

</body>

</html>
