<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Course</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #D6ED17FF, #606060FF);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .form-container h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .form-container label {
      display: block;
      color: #fff;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-container input,
    .form-container select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
    }

    .form-container button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #fff;
      color: #333;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .form-container button:hover {
      background-color: #333;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particles i {
      position: absolute;
      border-radius: 50%;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: float 20s linear infinite;
      bottom: -150px;
    }

    .particles i:nth-child(1) { left: 10%; animation-duration: 10s; width: 10px; height: 10px; }
    .particles i:nth-child(2) { left: 25%; animation-duration: 18s; width: 15px; height: 15px; }
    .particles i:nth-child(3) { left: 40%; animation-duration: 12s; }
    .particles i:nth-child(4) { left: 60%; animation-duration: 20s; width: 25px; height: 25px; }
    .particles i:nth-child(5) { left: 75%; animation-duration: 17s; width: 12px; height: 12px; }
    .particles i:nth-child(6) { left: 90%; animation-duration: 22s; width: 35px; height: 35px; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1200px) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .form-container {
        padding: 30px;
      }
      .form-container h1 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 20px;
      }
      .form-container h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="particles">
    <i></i>
    <i></i>
    <i></i>
    <i></i>
    <i></i>
    <i></i>
  </div>

  <div class="form-container">
    <h1>Add Course</h1>
    <form method="POST" action="{{ url_for('courses') }}">
      <label for="course_number">Course Number:</label>
      <input type="text" name="course_number" id="course_number" required>

      <label for="course_name">Course Name:</label>
      <input type="text" name="course_name" id="course_name" required>

      <label for="max_students">Maximum Students:</label>
      <input type="number" name="max_students" id="max_students" required>

      <label for="instructor">Instructor:</label>
      <select name="instructor" id="instructor" required>
        {% for instructor in instructors %}
          <option value="{{ instructor[0] }}">{{ instructor[1] }}</option>
        {% endfor %}
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
